name: Connect CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --version
      - run: npm test
      - run: node --check public/app.js && node --check api/connect.js && node --check gateway/send-window.mjs && sh -n gateway/openwrt-local-inventory.sh
